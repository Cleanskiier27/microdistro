name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Python text diagnostics
        run: python networkbuster.py --host localhost --skip-ping --skip-port-scan
      - name: Run Python JSON diagnostics
        run: python networkbuster.py --host localhost --json --skip-ping --skip-port-scan

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run PowerShell text diagnostics
        shell: pwsh
        run: ./networkbuster.ps1 -Target localhost -SkipPing -SkipPortScan
      - name: Run PowerShell JSON diagnostics
        shell: pwsh
        run: ./networkbuster.ps1 -Target localhost -Json -SkipPing -SkipPortScan
